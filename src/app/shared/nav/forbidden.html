<div class="flex min-h-[60vh] items-center justify-center">
  <app-card>
    <div class="font-display text-6xl font-bold text-flag-600">403</div>
    <h1 class="mt-2 font-display text-2xl font-semibold text-ocean-900">
      {{ 'forbidden.title' | transloco }}
    </h1>
    <p class="mt-3 font-heading text-sm text-ocean-500">
      {{ 'forbidden.description' | transloco: { route, permission } }}
    </p>
    <p class="mt-2 font-heading text-sm text-ocean-500">
      {{
        'forbidden.rolesInfo'
          | transloco: { roles: roles.join(', ') || ('forbidden.none' | transloco) }
      }}
    </p>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <a routerLink="/" [class]="primaryClasses">{{ 'forbidden.backToProfile' | transloco }}</a>
      <button type="button" [class]="navClasses" (click)="requestAccess()">
        {{ 'forbidden.requestAccess' | transloco }}
      </button>
    </div>
  </app-card>
</div>
