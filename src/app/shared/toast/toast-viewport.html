<div
  class="pointer-events-none fixed inset-x-4 bottom-4 z-50 flex flex-col items-end gap-2 sm:inset-x-auto sm:right-4"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      animate.enter="anim-toast-enter"
      animate.leave="anim-toast-leave"
      class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-lg border-l-4 bg-white px-4 py-3 font-heading text-sm text-ocean-900 shadow-lg"
      [class]="toneClasses[toast.tone]"
    >
      <span class="mt-0.5 shrink-0">
        @switch (toast.tone) {
          @case ('success') {
            <svg
              class="size-5 text-success-600"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="10" cy="10" r="8" />
              <path d="m6.5 10.5 2.2 2.2L14 8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('error') {
            <svg
              class="size-5 text-flag-600"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="10" cy="10" r="8" />
              <path d="M10 6.5v4.5" stroke-linecap="round" />
              <circle cx="10" cy="13.75" r="0.9" fill="currentColor" stroke="none" />
            </svg>
          }
          @default {
            <svg
              class="size-5 text-ocean-700"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="10" cy="10" r="8" />
              <path d="M10 9v4.5" stroke-linecap="round" />
              <circle cx="10" cy="6.25" r="0.9" fill="currentColor" stroke="none" />
            </svg>
          }
        }
      </span>
      <span class="flex-1">{{ toast.message }}</span>
      <button
        type="button"
        class="cursor-pointer text-ocean-700/50 transition-colors hover:text-ocean-900"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss"
      >
        ✕
      </button>
    </div>
  }
</div>
