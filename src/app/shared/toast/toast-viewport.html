<div class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      animate.enter="anim-toast-enter"
      animate.leave="anim-toast-leave"
      class="pointer-events-auto flex items-center gap-3 rounded-full border-2 px-5 py-2 font-heading text-sm font-semibold shadow-lg"
      [class]="toneClasses[toast.tone]"
    >
      <span>{{ toast.message }}</span>
      <button
        type="button"
        class="cursor-pointer opacity-70 hover:opacity-100"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss"
      >
        ✕
      </button>
    </div>
  }
</div>
