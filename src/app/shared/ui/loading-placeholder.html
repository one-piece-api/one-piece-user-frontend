<div class="flex flex-col items-center gap-3 py-2" role="status" aria-live="polite">
  <span class="sr-only">{{ label() }}</span>
  <img
    src="assets/sunny.png"
    alt=""
    aria-hidden="true"
    class="anim-bob w-24 drop-shadow-lg"
  />
  <div class="flex gap-1.5" aria-hidden="true">
    <span class="anim-loading-dot block size-1.5 rounded-full bg-treasure-500"></span>
    <span class="anim-loading-dot block size-1.5 rounded-full bg-treasure-500" style="animation-delay: 0.15s"></span>
    <span class="anim-loading-dot block size-1.5 rounded-full bg-treasure-500" style="animation-delay: 0.3s"></span>
  </div>
</div>
