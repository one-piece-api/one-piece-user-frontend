<nav
  aria-label="breadcrumb"
  class="flex w-fit max-w-full flex-wrap items-center gap-1.5 rounded-full bg-white/85 px-3.5 py-1.5 shadow-md backdrop-blur-sm"
>
  @for (crumb of crumbs(); track crumb.label; let last = $last) {
    <span class="inline-flex min-w-0 items-center gap-1.5">
      @if (crumb.route && !last) {
        <a
          [routerLink]="crumb.route"
          class="inline-flex items-center gap-1 truncate font-heading text-[13px] font-extrabold text-ocean-700"
        >
          @if (crumb.icon) {
            <app-icon class="font-display text-ocean-700" [icon]="crumb.icon" />
          }
          {{ crumb.label }}
        </a>
      } @else {
        <span
          class="inline-flex items-center gap-1 truncate font-heading text-[13px] font-extrabold"
          [class]="last ? 'text-ocean-950' : 'text-ocean-500'"
          [attr.aria-current]="last ? 'page' : null"
        >
          @if (crumb.icon) {
            <app-icon class="font-display text-ocean-700" [icon]="crumb.icon" />
          }
          {{ crumb.label }}
        </span>
      }
      @if (!last) {
        <span class="font-heading text-[13px] font-extrabold text-ocean-500/60">›</span>
      }
    </span>
  }
</nav>
