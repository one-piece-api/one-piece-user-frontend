<header class="border-b border-ocean-900/10 bg-ocean-900">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <a routerLink="/" class="font-display text-xl font-semibold tracking-wide text-parchment-50">
      One Piece API
    </a>
    @if (currentUser.me.value(); as identity) {
      <nav class="flex items-center gap-6 font-heading text-sm">
        @if (identity.roles.includes('ADMIN')) {
          <a
            routerLink="/admin/users"
            routerLinkActive="text-treasure-400"
            class="text-parchment-100/80 transition-colors hover:text-parchment-50"
            >Crew Manifest</a
          >
        }
        <span class="text-parchment-100/60">{{ identity.username }}</span>
        <a
          [href]="logoutUrl"
          class="text-parchment-100/80 transition-colors hover:text-parchment-50"
          >Log Out</a
        >
      </nav>
    }
  </div>
</header>
