<div class="relative">
  <div class="mb-2 font-heading text-xs font-black tracking-wide text-ocean-500 uppercase">
    {{ label() }}
  </div>
  <button
    #trigger
    type="button"
    (click)="toggle()"
    class="flex w-full items-center justify-between gap-2 rounded-xl border-2 bg-parchment-100 px-3.5 py-2.5 font-heading text-sm font-bold transition-colors"
    [class]="open() ? 'border-ocean-700 text-ocean-900' : value() ? 'border-ocean-900/15 text-ocean-900' : 'border-ocean-900/15 text-ocean-500'"
  >
    <span>⚓ {{ displayValue() }}</span>
    <span class="text-xs text-ocean-500">▾</span>
  </button>

  <div
    #popover
    popover="auto"
    (toggle)="onNativeToggle($event)"
    class="fixed z-30 m-0 w-64 rounded-2xl border-0 bg-parchment-100 p-4 text-left shadow-xl ring-1 ring-ocean-900/10"
  >
    <!-- Only rendered while open: keeps a closed picker's calendar grid out of the DOM
         entirely, rather than just visually hidden by the popover attribute. -->
    @if (open()) {
      <div class="mb-2.5 flex items-center justify-between">
        <button
          type="button"
          (click)="previousMonth()"
          class="flex size-7 cursor-pointer items-center justify-center rounded-lg bg-parchment-200 font-bold text-ocean-700"
        >
          ‹
        </button>
        <div class="font-display text-sm font-bold text-ocean-900 capitalize">{{ monthLabel() }}</div>
        <button
          type="button"
          (click)="nextMonth()"
          class="flex size-7 cursor-pointer items-center justify-center rounded-lg bg-parchment-200 font-bold text-ocean-700"
        >
          ›
        </button>
      </div>
      <div class="mb-1 grid grid-cols-7 gap-0.5">
        @for (weekday of weekdayLabels; track weekday) {
          <div class="text-center font-heading text-[11px] font-bold text-ocean-500">{{ weekday }}</div>
        }
      </div>
      @for (week of weeks(); track $index) {
        <div class="mb-0.5 grid grid-cols-7 gap-0.5">
          @for (day of week; track day.iso ?? $index) {
            <button
              type="button"
              [disabled]="!day.iso"
              (click)="pick(day)"
              class="aspect-square rounded-lg font-heading text-[13px] transition-colors"
              [class]="
                day.isSelected
                  ? 'bg-treasure-500 font-extrabold text-ocean-950'
                  : day.isToday
                    ? 'border-2 border-ocean-700 font-bold text-ocean-900'
                    : day.iso
                      ? 'cursor-pointer font-semibold text-ocean-900 hover:bg-parchment-200'
                      : 'text-transparent'
              "
            >
              {{ day.label }}
            </button>
          }
        </div>
      }
      <div class="mt-2.5 flex justify-between border-t border-ocean-900/10 pt-2.5">
        <button
          type="button"
          (click)="pickToday()"
          class="cursor-pointer font-heading text-xs font-extrabold text-ocean-700"
        >
          Today
        </button>
        <button
          type="button"
          (click)="clear()"
          class="cursor-pointer font-heading text-xs font-extrabold text-flag-600"
        >
          Clear
        </button>
      </div>
    }
  </div>
</div>
