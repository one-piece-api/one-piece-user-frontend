<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop-click-to-dismiss on the dialog itself; ESC already closes it natively -->
<dialog
  #dialog
  class="m-auto w-full max-w-[440px] rounded-3xl bg-parchment-100 p-6.5 shadow-2xl backdrop:bg-ocean-950/55"
  aria-labelledby="confirm-title"
  (close)="onClose()"
  (click)="onBackdropClick($event, dialog)"
>
  <div class="mb-3 flex items-center gap-3">
    <span
      class="grid size-11 flex-none place-items-center rounded-full font-display text-xl font-bold"
      [class]="toneClasses().icon"
      aria-hidden="true"
      >!</span
    >
    <h2 id="confirm-title" class="font-display text-[22px] leading-tight font-bold text-ocean-950">
      {{ title() }}
    </h2>
  </div>
  <p class="font-heading text-[15px] leading-relaxed font-semibold text-pretty text-ocean-500">
    {{ body() }}
  </p>
  @if (note(); as note) {
    <p
      class="mt-3.5 rounded-[14px] bg-parchment-200 px-4 py-3 font-heading text-[13px] leading-relaxed font-bold text-ocean-500"
    >
      {{ note }}
    </p>
  }
  <div class="mt-5 flex flex-wrap justify-end gap-2.5">
    <button
      type="button"
      class="cursor-pointer rounded-[14px] bg-parchment-200 px-5 py-3 font-heading text-[15px] font-extrabold text-ocean-500 disabled:pointer-events-none disabled:opacity-50"
      [disabled]="busy()"
      (click)="dialog.close()"
    >
      {{ 'common.cancel' | transloco }}
    </button>
    <button
      type="button"
      class="cursor-pointer rounded-[14px] px-5 py-3 font-heading text-[15px] font-extrabold text-white disabled:pointer-events-none disabled:opacity-50"
      [class]="toneClasses().button"
      [disabled]="busy()"
      data-testid="confirm-action"
      (click)="confirmed.emit()"
    >
      {{ busy() ? ('common.working' | transloco) : confirmLabel() }}
    </button>
  </div>
</dialog>
