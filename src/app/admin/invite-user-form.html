<form (submit)="onSubmit($event)" novalidate class="flex flex-col gap-4 text-left">
  <div>
    <label for="invite-email" class="mb-1.5 block font-heading text-xs font-bold text-ocean-500"
      >Email</label
    >
    <input
      id="invite-email"
      type="email"
      [formField]="inviteForm.email"
      placeholder="e.g. usopp@onepiece.local"
      class="w-full rounded-lg border border-ocean-900/15 bg-parchment-50 px-3 py-2 font-heading text-ocean-900 transition-colors focus:border-ocean-700 focus:outline-none"
    />
    @if (inviteForm.email().touched() && inviteForm.email().errors().length > 0) {
      <p class="mt-1 font-heading text-sm text-flag-700">
        {{ inviteForm.email().errors()[0].message }}
      </p>
    }
  </div>

  <div>
    <span class="mb-1.5 block font-heading text-xs font-bold text-ocean-500">Initial Roles</span>
    <div class="flex flex-wrap gap-2">
      <label
        class="flex cursor-pointer items-center gap-2 rounded-full border-2 border-dashed border-ocean-700/30 bg-parchment-50 px-3.5 py-2 font-heading text-sm font-bold text-ocean-900 transition-colors has-[:checked]:border-ocean-700 has-[:checked]:bg-ocean-700 has-[:checked]:text-white"
      >
        <input type="checkbox" [formField]="inviteForm.adminRole" class="sr-only" />
        ADMIN
      </label>
      <label
        class="flex cursor-pointer items-center gap-2 rounded-full border-2 border-dashed border-ocean-700/30 bg-parchment-50 px-3.5 py-2 font-heading text-sm font-bold text-ocean-900 transition-colors has-[:checked]:border-ocean-700 has-[:checked]:bg-ocean-700 has-[:checked]:text-white"
      >
        <input type="checkbox" [formField]="inviteForm.reviewerRole" class="sr-only" />
        REVIEWER
      </label>
      <label
        class="flex cursor-pointer items-center gap-2 rounded-full border-2 border-dashed border-ocean-700/30 bg-parchment-50 px-3.5 py-2 font-heading text-sm font-bold text-ocean-900 transition-colors has-[:checked]:border-ocean-700 has-[:checked]:bg-ocean-700 has-[:checked]:text-white"
      >
        <input type="checkbox" [formField]="inviteForm.editorRole" class="sr-only" />
        EDITOR
      </label>
    </div>
    @if (inviteForm().touched() && inviteForm().errors().length > 0) {
      <p class="mt-1 font-heading text-sm text-flag-700">
        {{ inviteForm().errors()[0].message }}
      </p>
    }
  </div>

  <div class="mt-2 flex justify-end gap-3">
    <button type="button" [class]="cancelClasses" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" [class]="submitClasses" [disabled]="inviteForm().submitting()">
      {{ inviteForm().submitting() ? 'Sending…' : 'Send Invitation' }}
    </button>
  </div>
</form>
