<div class="relative">
  <div class="mb-2 font-heading text-xs font-black tracking-wide text-ocean-500 uppercase">Action type</div>
  <button
    #trigger
    type="button"
    (click)="toggleMenu()"
    class="flex w-full items-center justify-between gap-2 rounded-xl border-2 bg-parchment-100 px-3.5 py-2.5 font-heading text-sm font-bold text-ocean-900 transition-colors"
    [class]="open() ? 'border-ocean-700' : 'border-ocean-900/15'"
  >
    <span class="truncate">{{ summary() }}</span>
    <span class="flex-none text-xs text-ocean-500">▾</span>
  </button>

  <div
    #popover
    popover="auto"
    (toggle)="onNativeToggle($event)"
    class="fixed z-30 m-0 grid max-h-80 min-w-64 gap-0.5 overflow-y-auto rounded-2xl border-0 bg-parchment-100 p-2 shadow-xl ring-1 ring-ocean-900/10"
  >
    <!-- Only rendered while open: keeps a closed menu's checkbox list out of the DOM
         entirely, rather than just visually hidden by the popover attribute. -->
    @if (open()) {
      @for (action of actionKeys; track action) {
        <button
          type="button"
          (click)="toggleAction(action)"
          [attr.aria-pressed]="selected().has(action)"
          class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-left font-heading text-sm font-bold text-ocean-900 hover:bg-parchment-200"
        >
          <span
            class="flex size-[18px] flex-none items-center justify-center rounded-[5px] border-2 text-[11px] font-extrabold text-white"
            [class]="selected().has(action) ? 'border-ocean-700 bg-ocean-700' : 'border-ocean-900/25 bg-transparent'"
          >
            @if (selected().has(action)) {
              ✓
            }
          </span>
          <span class="size-2 flex-none rounded-full" [class]="dotClassByAction[action]"></span>
          {{ actionLabel[action] ?? action }}
        </button>
      }
    }
  </div>
</div>
