<ol class="flex min-w-0 flex-1 items-start overflow-x-auto px-4 pt-5 pb-0.5">
  @for (link of links(); track link.number; let first = $first) {
    <li class="flex items-start">
      @if (!first) {
        <span class="mt-5 h-1 w-7.5 rounded-sm bg-parchment-200"></span>
      }
      <div class="flex min-w-14.5 flex-col items-center gap-3.5">
        <button
          type="button"
          class="relative grid size-11 place-items-center rounded-full border-[2.5px] font-display text-[15px] font-bold transition"
          [class]="link.circleClasses"
          [class.border-dashed]="link.neverPublished"
          [title]="link.title"
          [attr.aria-pressed]="link.selected"
          data-testid="version-link"
          (click)="picked.emit(link.number)"
        >
          {{ link.label }}
          @if (link.online) {
            <span
              class="absolute -top-1.5 -right-1.5 grid size-5 place-items-center rounded-full border-2 border-white bg-status-published-accent text-[10px] leading-none text-white"
              aria-hidden="true"
              data-testid="online-anchor"
              >⚓</span
            >
          }
        </button>
        <span
          class="min-h-3.5 rounded-full px-1.5 py-px font-heading text-[10px] font-extrabold tracking-wide whitespace-nowrap lowercase"
          [class]="link.captionClasses"
          >{{ link.captionKey ? (link.captionKey | transloco) : '' }}</span
        >
      </div>
    </li>
  }
</ol>
