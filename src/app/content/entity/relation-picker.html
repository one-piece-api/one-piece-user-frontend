<div class="relative">
  <input
    #box
    [id]="inputId()"
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="list"
    aria-haspopup="listbox"
    class="w-full rounded-[11px] border-2 bg-white py-2.5 pr-10 pl-3 font-heading text-[15px] font-bold text-ocean-950 focus:border-ocean-700 focus:outline-none"
    [class]="invalid() ? 'border-flag-600' : 'border-ocean-800/20'"
    [value]="shown()"
    [placeholder]="placeholder()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listboxId()"
    [attr.aria-activedescendant]="activeId()"
    [attr.aria-invalid]="invalid() ? true : null"
    (focus)="openList()"
    (click)="openList()"
    (input)="onInput(box.value)"
    (keydown)="onKeydown($event)"
    (blur)="closeList()"
  />
  @if (value() && !open()) {
    <button
      type="button"
      class="absolute inset-y-0 right-0 cursor-pointer px-3 text-ocean-500 hover:text-flag-700"
      [attr.aria-label]="'content.editor.relation.clear' | transloco"
      data-testid="relation-clear"
      (click)="clear()"
    >
      <span aria-hidden="true">✕</span>
    </button>
  }
  @if (open()) {
    <ul
      role="listbox"
      [id]="listboxId()"
      class="absolute z-20 mt-1 max-h-64 w-full overflow-y-auto rounded-xl border-2 border-ocean-800/20 bg-white py-1 shadow-lg"
      data-testid="relation-choices"
    >
      @if (status(); as status) {
        <li
          role="presentation"
          class="px-3 py-2 font-heading text-sm font-bold text-ocean-500"
          data-testid="relation-status"
        >
          {{ 'content.editor.relation.' + status | transloco }}
        </li>
      }
      @for (choice of choices(); track choice.reference.id) {
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- an option of a combobox is not focusable: the keyboard works on the input, which points at the active one -->
        <li
          role="option"
          class="cursor-pointer px-3 py-2 font-heading text-[15px] font-bold text-ocean-950"
          [id]="choice.id"
          [class]="choice.active ? 'bg-ocean-100' : 'hover:bg-parchment-200'"
          [attr.aria-selected]="choice.selected"
          data-testid="relation-choice"
          (mousedown)="$event.preventDefault()"
          (click)="choose(choice.reference)"
        >
          {{ choice.label }}
          @if (choice.selected) {
            <span class="sr-only"> ✓</span>
          }
        </li>
      }
    </ul>
  }
</div>
