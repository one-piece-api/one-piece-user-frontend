<span
  class="inline-flex items-center rounded-full font-heading font-extrabold whitespace-nowrap"
  [class]="pillClasses()"
>
  @if (prominent()) {
    <span aria-hidden="true">{{ glyph() }}</span>
  } @else {
    <span class="size-2 rounded-full" [class]="dotClasses()"></span>
  }
  {{ labelKey() | transloco }}
</span>
