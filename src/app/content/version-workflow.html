<div class="grid min-w-0 grid-cols-[minmax(0,1fr)] gap-3.5">
  <app-route-map [version]="version()" [events]="events()" />

  <div
    class="mt-2 flex flex-wrap items-start gap-x-9 gap-y-5.5 border-t border-parchment-200 pt-5.5"
  >
    <app-workflow-timeline
      class="min-w-0 flex-[2_1_460px]"
      [events]="events()"
      [basedOn]="version().basedOn"
    />
    <app-access-panel class="min-w-0 flex-[1_1_280px]" [version]="version()" />
  </div>
</div>
