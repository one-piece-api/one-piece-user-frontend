<app-reject-dialog
  [open]="askingReasonFor() !== null"
  [target]="rejectTarget()"
  [busy]="acting()"
  (confirmed)="rejectWith($event)"
  (cancelled)="askingReasonFor.set(null)"
/>

@if (overrideConfirmation(); as dialog) {
  <app-confirm-dialog
    [open]="true"
    [title]="dialog.title"
    [body]="dialog.body"
    [note]="dialog.note"
    [confirmLabel]="dialog.confirmLabel"
    tone="danger"
    data-testid="override-dialog"
    (confirmed)="confirmOverride()"
    (cancelled)="overriding.set(null)"
  />
}

@if (confirmation(); as dialog) {
  <app-confirm-dialog
    [open]="true"
    [busy]="acting()"
    [title]="dialog.title"
    [body]="dialog.body"
    [note]="dialog.note"
    [confirmLabel]="dialog.confirmLabel"
    [tone]="dialog.tone"
    (confirmed)="confirm()"
    (cancelled)="confirming.set(null)"
  />
}
