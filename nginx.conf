server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Generato a startup del container da KEYCLOAK_ORIGIN (vedi
    # docker-entrypoint.d/40-generate-runtime-config.sh) - mai in cache, o un
    # browser potrebbe tenere quello di un deploy precedente.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Translation catalogs aren't content-hashed like the JS/CSS bundles, so their URL
    # stays the same across deploys even when their content changes - same "old deploy
    # stuck in cache" risk as index.html/config.json above, just for translation text
    # instead of markup. "no-cache" (not "no-store"): still cacheable, just always
    # revalidated against the server first, so an unchanged file is still served via a
    # cheap 304.
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    # Angular client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's hashed bundle filename - if a browser
    # caches this file (nginx sends no explicit Cache-Control by default, so heuristic
    # caching can kick in), it keeps loading an old bundle after every future deploy
    # until a hard refresh. try_files' fallback above re-enters this exact location for
    # every unknown route, so this also covers the SPA-routing case, not just a direct
    # request to "/index.html".
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
